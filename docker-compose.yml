version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/apex_retail.db
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.simulator --stores 5 --duration 0
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - SIM_SPEED=5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  db_data:
    driver: local
